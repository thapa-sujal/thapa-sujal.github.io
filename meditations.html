<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — Sujal Thapa</title>
  <meta name="description" content="Articles by Sujal Thapa (also spelled Suzal Thapa) — engineering, computation, and the ideas in between." />
  <meta name="author" content="Sujal Thapa" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://thapa-sujal.github.io/meditations.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Articles — Sujal Thapa" />
  <meta property="og:description" content="Writing by Sujal Thapa on engineering, computation, and the ideas in between." />
  <meta property="og:url" content="https://thapa-sujal.github.io/meditations.html" />

  <!-- MathJax for LaTeX in meditations -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
  <script>
    // Typeset math in `el`, waiting for MathJax to finish loading if needed.
    function typesetMath(el) {
      if (!window.MathJax) return;
      if (MathJax.typesetPromise) {
        MathJax.typesetClear && MathJax.typesetClear([el]);
        MathJax.typesetPromise([el]);
      } else if (MathJax.startup && MathJax.startup.promise) {
        MathJax.startup.promise.then(() => MathJax.typesetPromise([el]));
      }
    }
  </script>

  <style>
    /* ── THEME TOKENS ─────────────────────────────── */
    :root {
      --bg:         #F4F4F0;
      --surface:    #ECEAE4;
      --card:       #F4F4F0;
      --accent:     #4A6080;
      --accent-lt:  #5A7090;
      --accent-rgb: 74,96,128;
      --tx1:        #1A1E26;
      --tx2:        #252A36;
      --tx3:        #363C4A;
      --tx5:        #6A7280;
      --tx6:        #9AA0AA;
      --sh-rgb:     26,30,38;
      --nav-bg:     rgba(251,245,236,0.88);
      --grain:      0.03;
    }
    [data-theme="dark"] {
      --bg:         #111008;
      --surface:    #1C1A12;
      --card:       #1E1B11;
      --accent:     #C9933A;
      --accent-lt:  #D4A84A;
      --accent-rgb: 201,147,58;
      --tx1:        #E8DFCC;
      --tx2:        #D0C8B4;
      --tx3:        #B4AA94;
      --tx5:        #786858;
      --tx6:        #504030;
      --sh-rgb:     0,0,0;
      --nav-bg:     rgba(17,16,8,0.92);
      --grain:      0.055;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: Arial, Helvetica, sans-serif; background-color: var(--bg); color: var(--tx2); line-height: 1.6; min-height: 100vh; transition: background-color 0.3s, color 0.3s; }

    /* Grain */
    body::after {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 200; opacity: var(--grain);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px; transition: opacity 0.3s;
    }

    /* Nav */
    .nav-link {
      position: relative; color: var(--tx5);
      font-size: 0.875rem; letter-spacing: 0; text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: -3px; left: 0;
      width: 0; height: 1.5px; background: var(--accent);
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-link:hover { color: var(--accent); }
    .nav-link:hover::after { width: 100%; }
    .nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

    /* Back link */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.875rem; font-weight: 600; letter-spacing: 0;
      color: var(--tx5); text-decoration: none;
      transition: color 0.2s, gap 0.2s;
    }
    .back-link:hover { color: var(--accent); gap: 10px; }
    .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

    /* Theme toggle */
    #theme-toggle {
      background: none; border: 1.5px solid rgba(var(--accent-rgb),0.25); cursor: pointer;
      width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--tx5); transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    #theme-toggle:hover { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb),0.07); }
    #theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

    /* Essay rows */
    .essay-row {
      width: 100%; background: none; border: none; border-top: 1px solid rgba(var(--accent-rgb),0.12);
      padding: 28px 0; display: grid; grid-template-columns: 52px 1fr auto;
      gap: 0 24px; align-items: start; cursor: pointer; text-align: left;
      transition: background 0.18s;
    }
    .essay-row:last-of-type { border-bottom: 1px solid rgba(var(--accent-rgb),0.12); }
    .essay-row:hover { background: rgba(var(--accent-rgb),0.03); }
    .essay-row:hover .er-title { color: var(--accent); }
    .essay-row:hover .er-arrow { opacity: 1; transform: translateX(4px); }
    .essay-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .er-num { font-family: Arial, Helvetica, sans-serif; font-size: 0.875rem; font-weight: 400; color: var(--tx6); line-height: 1; padding-top: 5px; }
    .er-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
    .er-tag { font-size: 0.8125rem; font-weight: 500; letter-spacing: 0; color: var(--accent); background: none; border: 0; padding: 0; }
    .er-date { font-size: 0.8125rem; color: var(--tx6); }
    .er-title { font-family: Arial, Helvetica, sans-serif; font-size: 1.25rem; font-weight: 600; color: var(--tx1); letter-spacing: -0.015em; line-height: 1.25; margin-bottom: 7px; transition: color 0.2s; }
    .er-preview { font-size: 0.875rem; line-height: 1.65; color: var(--tx5); max-width: 64ch; }
    .er-arrow { font-size: 1.125rem; color: var(--accent); opacity: 0; transform: translateX(0); transition: opacity 0.2s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1); padding-top: 4px; }

    /* Modal */
    #essay-modal {
      display: none; position: fixed; inset: 0; z-index: 500;
      align-items: flex-start; justify-content: center;
      padding: 40px 24px; overflow-y: auto;
    }
    #essay-modal.open #modal-backdrop { opacity: 1; }
    #essay-modal.open #modal-content { opacity: 1; transform: translateY(0); }

    #modal-backdrop {
      position: fixed; inset: 0; background: rgba(var(--sh-rgb),0.55);
      backdrop-filter: blur(4px); opacity: 0;
      transition: opacity 0.3s; cursor: pointer;
    }
    #modal-content {
      position: relative; z-index: 1;
      background: var(--card); border-radius: 2px;
      width: 100%; max-width: 680px;
      padding: 56px 60px;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.35s cubic-bezier(0.4,0,0.2,1), transform 0.35s cubic-bezier(0.4,0,0.2,1), background 0.3s;
      box-shadow: 0 12px 40px rgba(var(--sh-rgb),0.18);
    }
    #modal-close {
      position: absolute; top: 20px; right: 24px;
      background: none; border: none; cursor: pointer;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; color: var(--tx6);
      transition: background 0.2s, color 0.2s;
    }
    #modal-close:hover { background: rgba(var(--accent-rgb),0.08); color: var(--accent); }
    #modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal-body-text p { font-size: 1.0125rem; line-height: 1.85; color: var(--tx3); margin-bottom: 18px; }
    .modal-body-text p:last-child { margin-bottom: 0; }
    .modal-body-text a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(var(--accent-rgb),0.4); transition: color 0.2s, border-color 0.2s; }
    .modal-body-text a:hover { color: var(--accent-lt); border-bottom-color: var(--accent); }
    .modal-body-text a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    .modal-body-text code { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 0.88em; background: rgba(var(--accent-rgb),0.08); padding: 1px 5px; border-radius: 4px; }
    .modal-body-text blockquote { margin: 26px 0; padding: 2px 0 2px 24px; border-left: 2px solid var(--accent); font-family: Georgia, serif; font-size: 1.15rem; font-style: italic; line-height: 1.6; color: var(--tx2); }
    .modal-body-text blockquote a { font-style: normal; }
    .modal-body-text ol { list-style: none; counter-reset: med; margin: 0 0 18px; padding: 0; }
    .modal-body-text ol > li { counter-increment: med; position: relative; padding-left: 46px; margin-bottom: 24px; font-size: 1.0125rem; line-height: 1.85; color: var(--tx3); }
    .modal-body-text ol > li:last-child { margin-bottom: 0; }
    .modal-body-text ol > li::before { content: counter(med); position: absolute; left: 0; top: 2px; width: 30px; font-family: Arial, Helvetica, sans-serif; font-size: 1rem; font-weight: 600; color: var(--accent); text-align: right; }
    .modal-body-text ol > li strong { color: var(--tx1); font-weight: 600; }
    .modal-body-text figure.med-figure { margin: 32px 0; }
    .modal-body-text figure.med-figure img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid rgba(var(--accent-rgb),0.15); background: #fff; box-shadow: 0 4px 18px rgba(var(--sh-rgb),0.08); }
    .modal-body-text figure.med-figure figcaption { margin-top: 12px; font-size: 0.8125rem; line-height: 1.6; color: var(--tx5); text-align: center; }
    .modal-body-text mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
    .modal-body-text mjx-container[display="true"] { margin: 20px 0; }

    /* Dark mode: nav + hardcoded inline colour overrides */
    [data-theme="dark"] header { background: var(--nav-bg) !important; border-bottom-color: rgba(var(--accent-rgb),0.09) !important; }
    [data-theme="dark"] [style*="color:#1A1E26"] { color: var(--tx1) !important; }
    [data-theme="dark"] [style*="color:#6A7280"] { color: var(--tx5) !important; }
    [data-theme="dark"] [style*="color:#9AA0AA"] { color: var(--tx6) !important; }
    [data-theme="dark"] [style*="color:#4A5060"] { color: var(--tx5) !important; }
    [data-theme="dark"] [style*="color:#4A6080"] { color: var(--accent) !important; }
    [data-theme="dark"] footer { border-top-color: rgba(var(--accent-rgb),0.1) !important; }

    @media (max-width: 768px) {
      #modal-content { padding: 40px 28px; }
      .essay-row { grid-template-columns: 40px 1fr; }
      .er-arrow { display: none; }
    }
  </style>
</head>

<body>

  <!-- ── NAV ── -->
  <header style="position:sticky;top:0;z-index:100;background:rgba(251,245,236,0.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(74,96,128,0.09);">
    <div style="max-width:720px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;">
      <a href="index.html" style="font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;color:#1A1E26;text-decoration:none;letter-spacing:-0.015em;">
        Sujal Thapa
      </a>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="theme-toggle" aria-label="Toggle dark mode">
          <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <a href="index.html" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to site
        </a>
      </div>
    </div>
  </header>

  <!-- ── PAGE HEADER ── -->
  <div style="max-width:720px;margin:0 auto;padding:64px 24px 56px;position:relative;">
    <h1 style="font-family:Arial,Helvetica,sans-serif;font-size:clamp(2.5rem,6vw,3.75rem);font-weight:600;color:#1A1E26;letter-spacing:-0.045em;line-height:1.08;margin-bottom:16px;">Articles</h1>
    <p style="font-size:1rem;line-height:1.75;color:#4A5060;max-width:48ch;">
      Short pieces on engineering, computation, and the ideas that don't fit neatly into a methods section. Newest first.
    </p>

    <div id="count-line" style="margin-top:32px;font-size:0.8125rem;color:#9AA0AA;"></div>
  </div>

  <!-- ── MEDITATION LIST ── -->
  <main style="max-width:720px;margin:0 auto;padding:0 24px 96px;">
    <div id="all-meditations-list"></div>
  </main>

  <!-- ── FOOTER ── -->
  <footer style="border-top:1px solid rgba(74,96,128,0.1);padding:28px 24px;">
    <div style="max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
      <p style="font-size:0.8125rem;color:#9AA0AA;">© 2026 Sujal Thapa.</p>
      <a href="index.html" class="back-link" style="font-size:0.8125rem;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to site
      </a>
    </div>
  </footer>

  <!-- ── MODAL ── -->
  <div id="essay-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-backdrop" onclick="closeModal()"></div>
    <div id="modal-content">
      <button id="modal-close" onclick="closeModal()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
        <span id="modal-tag" style="font-size:0.8125rem;font-weight:500;color:#4A6080;"></span>
        <span id="modal-date" style="font-size:0.8125rem;color:#9AA0AA;"></span>
      </div>
      <h2 id="modal-title" style="font-family:Arial,Helvetica,sans-serif;font-size:clamp(1.75rem,4vw,2.5rem);font-weight:600;color:#1A1E26;letter-spacing:-0.03em;line-height:1.12;margin-bottom:32px;"></h2>
      <div style="width:40px;height:2px;background:#4A6080;border-radius:2px;margin-bottom:32px;"></div>
      <div id="modal-body" class="modal-body-text"></div>
    </div>
  </div>

  <!-- ── SCRIPTS ── -->
  <script src="meditations-data.js"></script>
  <script>
    function render() {
      const list      = document.getElementById('all-meditations-list');
      const countLine = document.getElementById('count-line');
      if (!list) return;

      if (typeof MEDITATIONS === 'undefined' || MEDITATIONS.length === 0) {
        list.innerHTML = '<p style="color:#9AA0AA;font-size:0.875rem;padding:24px 0;">No articles yet. Run <code>python3 build_meditations.py</code> after adding .md files.</p>';
        return;
      }

      countLine.textContent = `${MEDITATIONS.length} article${MEDITATIONS.length === 1 ? '' : 's'}`;

      list.innerHTML = MEDITATIONS.map((m, i) => `
        <button class="essay-row" onclick="openModal(${i})" aria-label="Read: ${m.title}">
          <span class="er-num">${String(i + 1).padStart(2, '0')}</span>
          <div>
            <div class="er-meta">
              <span class="er-tag">${m.tag}</span>
              <span class="er-date">${m.date}</span>
            </div>
            <div class="er-title">${m.title}</div>
            <div class="er-preview">${m.preview}</div>
          </div>
          <span class="er-arrow" aria-hidden="true">→</span>
        </button>
      `).join('');
    }

    function openModal(index) {
      const m     = MEDITATIONS[index];
      const modal = document.getElementById('essay-modal');
      document.getElementById('modal-tag').textContent   = m.tag;
      document.getElementById('modal-date').textContent  = m.date;
      document.getElementById('modal-title').textContent = m.title;
      const body = document.getElementById('modal-body');
      body.innerHTML = m.body;
      typesetMath(body);
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => modal.classList.add('open'));
      document.getElementById('modal-close').focus();
    }

    function closeModal() {
      const modal = document.getElementById('essay-modal');
      modal.classList.remove('open');
      setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = ''; }, 320);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    render();

    // ── Theme toggle ──────────────────────────────────────────────────
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('icon-moon').style.display = theme === 'dark' ? 'none' : '';
      document.getElementById('icon-sun').style.display  = theme === 'dark' ? ''     : 'none';
    }
    applyTheme(localStorage.getItem('theme') || 'light');
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });
  </script>
</body>
</html>
